# States at the start (1 January 1444).
#
# How a state gets its land:
#   clio:     names of polities in the Cliopatria dataset (1444) that belong to this state
#   split_from + anchors: carve land out of a (too coarse) Cliopatria polity. Each pixel of the
#             parent goes to the nearest anchor point [lon, lat] of the states that split it.
#             radius_km limits how far from its anchors a state may reach.
#   claim:    take unowned land within radius_km of the anchors (e.g. Gaelic Ireland).
# Cliopatria polities not listed here become states of their own with default settings.
#
# government: monarchy | republic | theocracy | order (military order) | tribal
# succession: primogeniture (sons first, then daughters) | salic (men only) |
#             elective | open (any son, Ottoman style) | seniority (eldest male of the dynasty) |
#             republic (elected for life) | theocracy (elected cleric)
# color: map colour (hex). Leave out for an automatic colour.

