# Cultures and religions of the world on 1 January 1444.
#
# How the map is painted: every land pixel gets the culture of the NEAREST anchor
# point [lon, lat] (great-circle distance), so the anchors of neighbouring cultures
# draw the borders between them (a Voronoi partition). Add anchors along a border
# to move it. Religion = the culture's default religion, unless the pixel lies
# within radius_km of a religion_overrides anchor.
# Names: English forms as used on English Wikipedia where such forms exist.
# Source: hand-curated from general historical knowledge (no game data).

religions:
  catholic: {group: christian, color: "#e8d45c"}   # Latin Church
  orthodox: {group: christian, color: "#6aa0d8"}   # Eastern Orthodox
  hussite: {group: christian, color: "#c27a3a"}   # Bohemian Utraquists
  miaphysite: {group: christian, color: "#b0607a"}   # Ethiopian, Armenian, Coptic and Nubian churches
  nestorian: {group: christian, color: "#8e6cc0"}   # Church of the East (Assyrians)
  sunni: {group: muslim, color: "#3f9a5a"}
  shia: {group: muslim, color: "#2f6f3f"}   # Twelver Shia
