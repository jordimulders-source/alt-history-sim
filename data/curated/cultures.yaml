  confucian: {group: eastern, color: "#d94f4f"}   # China, Korea, Dai Viet
  shinto: {group: eastern, color: "#e86fa0"}   # Japan and Ryukyu
  tengri: {group: pagan, color: "#9fb8c8"}   # steppe Turko-Mongol faith
  shamanist: {group: pagan, color: "#7d9c9a"}   # Siberia, the Sami, Volga Finns, Jurchens
  animist: {group: pagan, color: "#9a7b54"}   # Africa, lowland South America, Southeast Asian hill peoples
  totemist: {group: pagan, color: "#b59a6a"}   # North America and the Caribbean
  nahuatl: {group: pagan, color: "#2e8ba0"}   # Mesoamerican religion
  inti: {group: pagan, color: "#e0a800"}   # Andean religion
  polynesian: {group: pagan, color: "#5fc2d6"}   # Oceania
